<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{meta.title}}</title>
    <meta name="description" content="{{meta.description}}">
    <link rel="icon" type="image/svg+xml" href="karma-icon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="min-h-screen flex flex-col">
    <main class="flex-1">
      <!-- Main section: the one dark place. The text column and the dot light are
           siblings in the flow, so the light always sits below the text, never under it. -->
      <section id="top" class="hero" aria-labelledby="hero-title">
        <div class="hero-column">
          <header class="header-bar" role="banner">
            <img src="karma-lockup-solid.svg" alt="{{logo.alt}}" width="113" height="28" class="block h-7 w-auto flex-none">
            <span class="header-divider max-[900px]:hidden" aria-hidden="true"></span>
            <p class="header-descriptor max-[900px]:hidden">{{header.descriptor}}</p>
            <nav aria-label="{{nav.label}}" class="flex flex-auto items-center justify-end gap-3">
              <a href="#how" class="header-link header-link-secondary max-[600px]:hidden">{{nav.howItWorks}}<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="block flex-none"><path d="M5.5 8l4.5 4.5L14.5 8"/></svg></a>
              <a href="#demo" class="header-link header-link-primary">{{action}}<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="block flex-none max-[420px]:hidden"><path d="M4 10h11M10.5 5.5L15 10l-4.5 4.5"/></svg></a>
            </nav>
          </header>

          <h1 id="hero-title" class="hero-title"><span class="block">{{hero.titleLine1}}</span> <span class="block">{{hero.titleLine2}}</span></h1>
          <p class="hero-support">{{hero.support}}</p>
          <a href="#demo" class="hero-button">{{action}}</a>
        </div>

        <div class="dot-light" aria-hidden="true">
          <div class="dot-field">
            <div class="dot-glow"></div>
            <div class="dot-layer dot-layer-1"></div>
            <div class="dot-layer dot-layer-2"></div>
            <div class="dot-layer dot-layer-3"></div>
            <div class="dot-layer dot-layer-4"></div>
            <div class="dot-layer dot-layer-5"></div>
            <div class="dot-sweep"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="border-t border-line bg-surface">
      <div class="mx-auto max-w-landing px-side py-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:gap-5 text-small text-ink-secondary">
        <img src="karma-lockup-solid.svg" alt="" width="113" height="28" class="h-7 w-auto self-start sm:self-auto">
        <span class="block h-px w-full bg-line-strong sm:h-6 sm:w-px" aria-hidden="true"></span>
        <p>{{footer}}</p>
      </div>
    </footer>
  </body>
</html>
